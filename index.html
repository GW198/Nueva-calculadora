<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --gold: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --text: #f1f5f9;
    --muted: #64748b;
    --card-glow: 0 0 30px rgba(0,212,255,0.08);
    --font-body: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }


/* APLICAR LA MISMA FUENTE A TODO */
  body, input, select, button, textarea, .container, .header, .theme-panel, 
  .seguro-card, .input-card, .results-card, .plan-tab, .mode-btn, .search-btn,
  .month-result-card, .result-metric, .costo-detalle, .tabla-dispersion,
  .resumen-dispersion, .match-badge, .plan-info-bar, .metric-value,
  .metric-label, .detalle-row, .mrc-months, .mrc-pago, .mrc-cat {
    font-family: var(--font-body);
  }

  /* Headings pueden mantener fuente distinta opcionalmente */
  .header h1, .section-label, .input-label, .theme-header h3, .plan-tab .tab-name {
    font-family: var(--font-body);
    font-weight: 700;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    position: relative;
    z-index: 1;
  }
.color-picker-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  
  .color-input-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    flex: 1;
  }
  
  .color-input-wrapper span {
    font-size: 12px;
    color: var(--text-muted);
  }
  
  input[type="color"] {
    width: 50px;
    height: 40px;
    border: 2px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    background: var(--surface);
    padding: 2px;
  }
  
  .color-hex-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 8px 12px;
    
    font-size: 13px;
    width: 100px;
  }
  
  .preset-colors {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  
  .preset-color {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s;
  }
  
  .preset-color:hover {
    transform: scale(1.1);
  }
  
  .preset-color.active {
    border-color: white;
    box-shadow: 0 0 0 1px var(--bg);
  }
  
  .font-select {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    
    font-size: 14px;
    padding: 10px 12px;
    width: 100%;
    cursor: pointer;
  }
  
  .font-size-control {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  
  .font-size-control input {
    flex: 1;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 12px;
  }
  
  .reset-theme-btn {
    background: rgba(239,68,68,0.15);
    border: 1px solid var(--red);
    border-radius: 12px;
    color: var(--red);
    padding: 10px 20px;
    cursor: pointer;
    
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
  }
  
  .reset-theme-btn:hover {
    background: rgba(239,68,68,0.25);
  }

   /* ========== PANEL DE TEMAS MEJORADO ========== */
  .theme-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: var(--card-glow);
  }

  .theme-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  
  .theme-header h3 {
    
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  
  .theme-toggle-icon {
    font-size: 20px;
    transition: transform 0.3s;
  }
  
  .theme-toggle-icon.open {
    transform: rotate(180deg);
  }
  
  .theme-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  
  .theme-content.open {
    max-height: 800px;
    margin-top: 20px;
  }
  
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 24px;
  }
  
  .theme-group {
    background: var(--surface2);
    border-radius: 16px;
    padding: 16px;
  }
  
  .theme-group label {
    
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 12px;
  }
  
  .header {
    text-align: center;
    padding: 40px 0 32px;
  }
  .header-badge {
    display: inline-block;
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,58,237,0.15));
    border: 1px solid rgba(0,212,255,0.3);
    color: var(--accent);
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .header h1 {
    
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 10px;
  }
  .header p {
    color: var(--muted);
    font-size: 15px;
  }

  .input-card, .seguro-card, .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 24px;
    box-shadow: var(--card-glow);
  }

  .search-mode {
    display: flex;
    gap: 12px;
    margin-bottom: 20px;
    background: var(--surface2);
    padding: 6px;
    border-radius: 40px;
    width: fit-content;
  }
  .mode-btn {
    padding: 8px 24px;
    border-radius: 32px;
    
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    background: transparent;
    color: var(--muted);
    border: none;
  }
  .mode-btn.active {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 12px rgba(0,212,255,0.3);
  }
  .mode-btn:hover:not(.active) {
    background: rgba(0,212,255,0.15);
    color: var(--text);
  }

  .input-label {
    
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input-label::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: stretch;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
  }

  .currency-prefix {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-size: 18px;
    font-weight: 500;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    
    font-size: 24px;
    font-weight: 700;
    padding: 16px 16px 16px 42px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.12);
  }
  #searchInput::placeholder { color: var(--muted); }

  .search-btn {
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 12px;
    color: #fff;
    
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 0 28px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .search-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(0,212,255,0.4);
  }
  .search-btn:active { transform: translateY(0); }

  .hint-text {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .section-label {
    
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .plan-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }

  .plan-tab {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--muted);
    cursor: pointer;
    padding: 10px 16px;
    
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
    text-align: center;
    flex: 1;
    min-width: 140px;
  }
  .plan-tab .tab-name {
    
    font-size: 13px;
    font-weight: 700;
    display: block;
    color: var(--text);
    margin-bottom: 2px;
  }
  .plan-tab .tab-rate {
    font-size: 11px;
    color: var(--muted);
  }
  .plan-tab .tab-cat {
    font-size: 11px;
    color: var(--green);
  }
  .plan-tab:hover {
    border-color: rgba(0,212,255,0.4);
    color: var(--text);
  }
  .plan-tab.active {
    background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(124,58,237,0.1));
    border-color: var(--accent);
    color: var(--text);
    box-shadow: 0 0 20px rgba(0,212,255,0.12);
  }
  .plan-tab.active .tab-rate { color: var(--accent); }

  .month-section {
    margin-bottom: 20px;
  }
  .month-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .month-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    padding: 10px 20px;
    
    font-size: 14px;
    font-weight: 700;
    transition: all 0.15s;
  }
  .month-btn:hover:not(.disabled) {
    border-color: var(--accent);
    color: var(--text);
  }
  .month-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 16px rgba(0,212,255,0.35);
  }
  .month-btn.disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  .results-card {
    transition: all 0.3s;
  }

  .results-empty {
    text-align: center;
    padding: 40px 20px;
  }
  .results-empty .icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.4;
  }
  .results-empty p {
    color: var(--muted);
    font-size: 15px;
  }

  .result-main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }

  .result-metric {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  .result-metric::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }
  .result-metric.highlight::before {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .result-metric .metric-label {
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .result-metric .metric-value {
    
    font-size: 26px;
    font-weight: 800;
    color: var(--accent);
  }
  .result-metric.highlight .metric-value {
    color: var(--gold);
  }
  .result-metric .metric-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .match-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(16,185,129,0.12);
    border: 1px solid rgba(16,185,129,0.3);
    color: var(--green);
    font-size: 12px;
    font-weight: 500;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 18px;
  }
  .match-badge .dot {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .all-months-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px;
    margin: 20px 0;
  }

  .month-result-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .month-result-card:hover {
    border-color: rgba(0,212,255,0.4);
  }
  .month-result-card.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(0,212,255,0.1), rgba(124,58,237,0.05));
    box-shadow: 0 0 16px rgba(0,212,255,0.12);
  }
  .month-result-card .mrc-months {
    
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
  }
  .month-result-card .mrc-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .month-result-card .mrc-pago {
    
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  .month-result-card .mrc-cat {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .month-result-card.unavailable {
    opacity: 0.3;
    cursor: not-allowed;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .plan-info-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: 10px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .plan-info-bar .pib-name {
    
    font-weight: 700;
    color: var(--text);
  }
  .plan-info-bar .pib-sep { color: var(--border); }
  .plan-info-bar .pib-detail { color: var(--muted); }

  .result-metric.costo-total::before {
    background: linear-gradient(90deg, var(--green), transparent);
  }
  .result-metric.costo-total .metric-value {
    color: var(--green);
  }
  .result-metric.intereses::before {
    background: linear-gradient(90deg, var(--gold), transparent);
  }
  .result-metric.intereses .metric-value {
    color: var(--gold);
  }

  .costo-detalle {
    margin-top: 20px;
    padding: 16px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
    border: 1px solid var(--border);
  }
  .costo-detalle .detalle-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 14px;
  }
  .costo-detalle .detalle-row:last-child {
    margin-bottom: 0;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-weight: 700;
    color: var(--text);
  }
  .costo-detalle .detalle-label {
    color: var(--muted);
  }
  .costo-detalle .detalle-valor {
    
    font-weight: 600;
  }

  /* Panel de Seguro */
  .seguro-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin-bottom: 24px;
    box-shadow: var(--card-glow);
  }
  .seguro-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
    margin-top: 16px;
  }
  .seguro-field {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .seguro-field label {
    
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .seguro-field select, .seguro-field input {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    
    font-size: 16px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .seguro-field select:focus, .seguro-field input:focus {
    border-color: var(--accent);
  }
  .seguro-resultado {
    margin-top: 20px;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-weight: 600;
  }
  .seguro-resultado.seguro1 {
    background: rgba(0,212,255,0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .seguro-resultado.seguro2 {
    background: rgba(245,158,11,0.15);
    border: 1px solid var(--gold);
    color: var(--gold);
  }
  .seguro-resultado.no-seguro {
    background: rgba(16,185,129,0.15);
    border: 1px solid var(--green);
    color: var(--green);
  }

  .resumen-dispersion {
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.05));
    border: 1px solid var(--accent);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
  }
  .resumen-dispersion .titulo {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .resumen-dispersion .monto {
    
    font-size: 30px;
    font-weight: 800;
  }
  .resumen-dispersion .rojo { color: var(--red); }
  .resumen-dispersion .verde { color: var(--green); }
  .resumen-dispersion .azul { color: var(--accent); }

  .tabla-dispersion {
    margin-top: 20px;
    overflow-x: auto;
  }
  .tabla-dispersion table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .tabla-dispersion th, .tabla-dispersion td {
    border: 1px solid var(--border);
    padding: 10px 8px;
    text-align: right;
  }
  .tabla-dispersion th {
    background: var(--surface2);
    font-size: 11px;
    text-align: center;
    color: var(--accent);
    
    letter-spacing: 1px;
  }
  .tabla-dispersion td:first-child {
    text-align: center;
  }
  .tabla-dispersion td:last-child {
    color: var(--gold);
    font-weight: 500;
  }

  @media (max-width: 600px) {
    .result-main { grid-template-columns: 1fr; }
    .plan-tabs { gap: 6px; }
    .plan-tab { min-width: 120px; }
    .input-row { flex-direction: column; }
    .search-btn { padding: 14px; }
    .resumen-dispersion .monto { font-size: 22px; }
    .tabla-dispersion { font-size: 11px; }
  }

  /* ========== ESTILOS DE LOGIN - INSERTAR DENTRO DE <style> ========== */
#loginOverlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
#loginOverlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}
.login-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 48px 40px;
  max-width: 400px;
  width: 90%;
  box-shadow: var(--card-glow);
  text-align: center;
}
.login-box .logo {
  font-size: 32px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff 30%, var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
}
.login-box .subtitle {
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 32px;
}
.login-box .input-group {
  margin-bottom: 20px;
  text-align: left;
}
.login-box .input-group label {
  display: block;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 6px;
}
.login-box .input-group input {
  width: 100%;
  background: var(--bg);

.cnca-card {

  margin-bottom: 24px;
  box-shadow: var(--card-glow);
}

/* Header del CNCA con botón toggle */
.cnca-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.cnca-header h3 {
  font-size: 14px;
  letter-spacing: 2px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
}
.cnca-toggle-icon {
  font-size: 20px;
  transition: transform 0.3s;
}
.cnca-toggle-icon.open {
  transform: rotate(180deg);
}

/* Contenido del CNCA (colapsable) */
.cnca-content {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease;
}
.cnca-content.open {
  max-height: 1200px;
  margin-top: 20px;
}

.cnca-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-top: 16px;
}
.cnca-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.cnca-field label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}
.cnca-field input {
  background: var(--surface2);
  border: 1.5px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 16px;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s;
}
.cnca-field input:focus {
  border-color: var(--accent);
}
.cnca-field input:disabled {
  opacity: 0.6;

}
.cnca-resultado {

  padding: 16px;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;

}
.cnca-resultado .cnca-valor {
  font-size: 28px;

.cnca-resultado .cnca-valor.rojo { color: var(--red); }

function procesarDatos(rawData) {
  const planesProcesados = {};
  
  for (const [planKey, plan] of Object.entries(rawData)) {
    const plazos = plan.plazos_meses;
    
    // Procesar cada fila de datos
    const rows = plan.data.map(item => {
      const montosPorPlazo = {};
      plazos.forEach(plazo => {
        const pago = item.pagos[plazo.toString()];
        if (pago && pago > 0) {
          montosPorPlazo[plazo] = pago;
        }
      });
      return {
        monto: item.monto,
        ...montosPorPlazo
      };
    }).filter(row => {
      return plazos.some(plazo => row[plazo] !== undefined);
    });
    
    planesProcesados[planKey] = {
      months: [...plazos].sort((a, b) => b - a),
      rows: rows
    };
  }
  
  return planesProcesados;
}

// ========== CALCULAR PAGO MENSUAL CON FÓRMULA ==========
function calcularPagoMensual(monto, plazoMeses) {
  // Obtener la tasa CON IVA según el plazo
  const tasaConIva = obtenerTasaPorPlazo(plazoMeses, true); // true = con IVA
  
  // Fórmula: P = M * (i * (1+i)^n) / ((1+i)^n - 1)
  // Donde:
  // M = monto solicitado
  // i = tasa mensual con IVA
  // n = número de meses
  
  if (tasaConIva === 0) return monto / plazoMeses; // Sin interés, pago lineal
  
  const i = tasaConIva;
  const n = plazoMeses;
  
  // Calcular (1+i)^n
  const potencia = Math.pow(1 + i, n);
  
  // Calcular pago mensual
  const pago = monto * (i * potencia) / (potencia - 1);
  
  return pago;
}
function obtenerTasaPorPlazo(plazoMeses, conIva = false) {
  const tasa = TASAS_POR_PLAZO[plazoMeses];
  if (!tasa) {
    // Si no encuentra el plazo, usa valores por defecto (60 meses)
    return conIva ? 0.0340 : 0.0293;
  }
  return conIva ? tasa.conIva : tasa.sinIva;
}

function applyTheme(theme) {
  const root = document.documentElement;
  root.style.setProperty('--font-body', theme.fontFamily);
  root.style.setProperty('--bg', theme.bg);
  root.style.setProperty('--surface', theme.surface);
  root.style.setProperty('--accent', theme.accent);
  root.style.setProperty('--text', theme.text);
  root.style.setProperty('--text-muted', theme.textMuted);
  
  root.style.setProperty('--card-glow', `0 0 ${theme.glowIntensity}px ${theme.accent}20`);
  document.body.style.fontSize = `${theme.baseFontSize}px`;
  
  // También actualizar el color de bordes derivado
  root.style.setProperty('--border', theme.accent + '40');
  root.style.setProperty('--surface2', `color-mix(in srgb, ${theme.surface} 80%, ${theme.accent} 20%)`);
}

function saveTheme(theme) {
  localStorage.setItem('userTheme', JSON.stringify(theme));
  applyTheme(theme);
}

function loadSavedTheme() {
  const saved = localStorage.getItem('userTheme');
  const defaultTheme = {
    bg: '#0a0e1a',
    surface: '#111827',
    accent: '#00d4ff',
    text: '#f1f5f9',
    textMuted: '#64748b',
    fontFamily: "'DM Sans', sans-serif",
    baseFontSize: 16,
    glowIntensity: 8
  };
  if (saved) {
    try {
      return { ...defaultTheme, ...JSON.parse(saved) };
    } catch(e) {}
  }
  return defaultTheme;
}

        theme.text = color;

function getCurrentTheme() {
  const root = getComputedStyle(document.documentElement);
  return {
    bg: root.getPropertyValue('--bg').trim(),
    surface: root.getPropertyValue('--surface').trim(),
    accent: root.getPropertyValue('--accent').trim(),
    text: root.getPropertyValue('--text').trim(),
    textMuted: root.getPropertyValue('--text-muted').trim(),
    fontFamily: root.getPropertyValue('--font-main').trim(),
    baseFontSize: parseInt(document.body.style.fontSize) || 16,
    glowIntensity: parseInt(root.getPropertyValue('--card-glow').match(/\d+/)?.[0] || 8)
  };
}

// Calcular tipo de seguro
function calcularTipoSeguro() {
  const tipoSeguro = document.getElementById('tipoSeguro').value;
  const genero = document.getElementById('genero').value;
  const edad = parseInt(document.getElementById('edad').value);
  
  const resultadoDiv = document.getElementById('seguroResultado');
  
  if (isNaN(edad) || edad < 18 || edad > 120) {
    resultadoDiv.innerHTML = '⚠️ Por favor, ingresa una edad válida (entre 18 y 120 años)';
    resultadoDiv.className = 'seguro-resultado no-seguro';
    return 'NO APLICA';
  }
  
  const reglas = {
    CESANTIA: (edad, genero) => {
      if (genero === 'FEMENINO') {
        if (edad >= 81 && edad <= 85) return 'SEGURO 1';
        return 'NO APLICA';
      }
      if (edad >= 81 && edad <= 85) return 'SEGURO 1';
      return 'NO APLICA';
    },
    VEJEZ: (edad, genero) => {
      if (genero === 'FEMENINO') {
        if (edad >= 81 && edad <= 85) return 'SEGURO 1';
        return 'NO APLICA';
      }
      if (edad >= 66 && edad <= 75) return 'SEGURO 1';
      if (edad >= 76 && edad <= 80) return 'SEGURO 2';
      if (edad >= 81 && edad <= 85) return 'SEGURO 1';
      return 'NO APLICA';
    },
    INVALIDEZ: (edad, genero) => {
      if (genero === 'FEMENINO') {
        if (edad >= 81 && edad <= 85) return 'SEGURO 1';
        return 'NO APLICA';
      }
      if (edad >= 51 && edad <= 75) return 'SEGURO 1';
      if (edad >= 76 && edad <= 80) return 'SEGURO 2';
      if (edad >= 81 && edad <= 85) return 'SEGURO 1';
      return 'NO APLICA';
    },
    VIUDEZ: (edad, genero) => {
      if (genero === 'FEMENINO') {
        if (edad >= 81 && edad <= 85) return 'SEGURO 1';
        return 'NO APLICA';
      }
      if (edad >= 81 && edad <= 85) return 'SEGURO 1';
      return 'NO APLICA';
    }
  };
  
  const resultado = reglas[tipoSeguro](edad, genero);
  let mensaje = '', clase = '';
  
  if (resultado === 'SEGURO 1') {
    mensaje = `SEGURO 1`;
    clase = 'seguro-resultado seguro1';
  } else if (resultado === 'SEGURO 2') {
    mensaje = `SEGURO 2`;
    clase = 'seguro-resultado seguro2';
  } else {
    mensaje = `NO APLICA seguro adicional`;
    clase = 'seguro-resultado no-seguro';
  }
  
  resultadoDiv.innerHTML = mensaje;
  resultadoDiv.className = clase;
  return resultado;
}

// Calcular cobro de seguro por mes
function calcularCobroSeguroMensual(saldo, interes, ivaInteres, tipoSeguro, mes, plazoTotal) {
  const valorAsegurable = saldo + interes + ivaInteres;
  const seguroBase = valorAsegurable * (1.99 / 1000);
  if (tipoSeguro === 'NO APLICA') return 0;
  if (tipoSeguro === 'SEGURO 1') return (mes <= 12) ? seguroBase : 0;
  if (tipoSeguro === 'SEGURO 2') return seguroBase;
  return 0;
}

// Calcular tabla de amortización completa
// Calcula la tabla de amortización completa usando la tasa según el plazo
function calcularAmortizacionConPagoFijo(montoInicial, plazoMeses, tipoSeguroPlan, pagoMensualReal) {
  // VALIDACIÓN: si el pago es 0 o inválido, no se puede calcular
  
  
  let saldo = montoInicial;
  let tabla = [];
  let totalSeguro = 0;
  
  // Obtener la tasa SIN IVA según el plazo
  const tasaInteresMensual = obtenerTasaPorPlazo(plazoMeses, false);
  
  console.log("Calculando:", { montoInicial, plazoMeses, pagoMensualReal, tasaInteresMensual });
  
  for (let mes = 1; mes <= plazoMeses; mes++) {
    // Interés sobre saldo actual (sin IVA)
    let interes = saldo * tasaInteresMensual;
    
    // IVA del interés (16%)
    let ivaInteres = interes * 0.16;
    
    // Pago a capital = pago mensual - interés - IVA
    let pagoCapital = pagoMensualReal - interes - ivaInteres;
    
    // Ajuste en el último mes
    if (mes === plazoMeses) {
      pagoCapital = saldo;
      // Recalcular pago mensual real del último mes
      let ultimoPago = saldo + interes + ivaInteres;
      if (ultimoPago > 0) {
        // Usar el pago real del último mes en lugar del estimado
        pagoCapital = saldo;
      }
    }
    
    // Validación para evitar NaN
    if (isNaN(pagoCapital) || !isFinite(pagoCapital)) {
      pagoCapital = 0;
    }
    
    // Cálculo del seguro
    let valorAsegurable = saldo + interes + ivaInteres;
    let cobroSeguro = 0;
    
    if (tipoSeguroPlan === 'SEGURO 1' && mes <= 12) {
      cobroSeguro = valorAsegurable * (1.99 / 1000);
    } else if (tipoSeguroPlan === 'SEGURO 2') {
      cobroSeguro = valorAsegurable * (1.99 / 1000);
    }
    
    totalSeguro += cobroSeguro;
    
    tabla.push({
      mes,
      saldoInicial: saldo,
      interes: interes,
      ivaInteres: ivaInteres,
      pagoCapital: pagoCapital,
      pagoMensual: pagoMensualReal,
      cobroSeguro: cobroSeguro
    });
    
    saldo = saldo - pagoCapital;
    if (saldo <= 0.01) break;
  }
  
  return { tabla, totalSeguro };
}

// Encontrar resultado por pago o monto

function encontrarResultado(planKey, monthStr, valorBusqueda) {
  const plan = DATASET[planKey];
  if (!plan) return null;
  
  const rows = plan.rows;
  let best = null;
  
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const pago = row[monthStr];
    
    if (!pago) continue;
    
    const valorComparar = searchMode === 'pago' ? pago : row.monto;
    
    if (valorComparar <= valorBusqueda) {
      best = { monto: row.monto, pago: pago };
    } else {
      break;
    }
  }
  
  return best;
}

// Obtener todos los resultados para un plan
function obtenerTodosResultados(planKey, valorBusqueda) {
  const plan = DATASET[planKey];
  if (!plan) return {};
  
  const resultados = {};
  plan.months.forEach(m => {
    const r = encontrarResultado(planKey, String(m), valorBusqueda);
    if (r) resultados[m] = r;
  });
  
  return resultados;
}

	// ========== FUNCIONES DEL APARTADO CNCA ==========

// Toggle (mostrar/ocultar) el contenido del CNCA
function toggleCNCA() {
  const content = document.getElementById('cncaContent');
  const icon = document.getElementById('cncaToggleIcon');
  content.classList.toggle('open');
  icon.classList.toggle('open');
}

// Calcular CNCA
function calcularCNCA() {
  const capacidad = parseFloat(document.getElementById('cncaCapacidad').value) || 0;
  const descuento = parseFloat(document.getElementById('cncaDescuento').value) || 0;
  const pagoAnticipado = parseFloat(document.getElementById('cncaPagoAnticipado').value) || 0;
  
  // Calcular solvencia (CAPACIDAD + DESCUENTO)
  const solvencia = capacidad + descuento;
  document.getElementById('cncaSolvencia').value = '$' + solvencia.toFixed(2);
  
  // Obtener monto solicitado del campo (si ya fue tomado de CSB 4695)
  const montoSolicitadoStr = document.getElementById('cncaMontoSolicitado').value;
  let montoSolicitado = 0;
  if (montoSolicitadoStr) {
    montoSolicitado = parseFloat(montoSolicitadoStr.replace(/[$,]/g, '')) || 0;
  }
  
  // Calcular resultado final
  const resultadoFinal = montoSolicitado - pagoAnticipado;
  document.getElementById('cncaResultadoFinal').value = '$' + resultadoFinal.toFixed(2);
  
  // Mostrar en el resumen
  const resultadoValor = document.getElementById('cncaResultadoValor');
  resultadoValor.textContent = '$' + resultadoFinal.toFixed(2);
  if (resultadoFinal < 0) {
    resultadoValor.className = 'cnca-valor rojo';
  } else {
    resultadoValor.className = 'cnca-valor verde';
  }
}

// Aplicar solvencia a la calculadora
function aplicarCNCA() {
  const solvenciaStr = document.getElementById('cncaSolvencia').value;
  if (solvenciaStr) {
    const solvencia = parseFloat(solvenciaStr.replace(/[$,]/g, '')) || 0;
    document.getElementById('searchInput').value = solvencia;
    buscar();
  }
}

// Tomar el monto del plan CSB 4695 (siempre del plazo de 60 meses)
function tomarMontoCSB() {
  // Verificar que el plan actual sea CSB 4695 2.4
  if (currentPlan !== 'CSB 4695 2.4') {
    alert('⚠️ Por favor, selecciona el plan "CSB 4695 2.4" primero.');
    // Cambiar automáticamente al plan CSB 4695 2.4
    const planKeys = Object.keys(DATASET);
    const csbKey = planKeys.find(key => key.includes('CSB 4695'));
    if (csbKey) {
      currentPlan = csbKey;
      // Actualizar pestañas
      document.querySelectorAll('.plan-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.plan === csbKey);
      });
      // Re-renderizar si hay búsqueda
      if (currentSearchValue) renderResults();
    }
    return;
  }
  
  // Obtener el monto específico del plazo de 60 meses
  const plan = DATASET[currentPlan];
  if (!plan) {
    alert('⚠️ No se encontraron datos del plan.');
    return;
  }
  
  // Verificar que el plazo de 60 meses existe
  if (!plan.months.includes(60)) {
    alert('⚠️ El plan CSB 4695 2.4 no tiene plazo de 60 meses.');
    return;
  }
  
  // Buscar el resultado para 60 meses con el valor de búsqueda actual
  const resultado60 = encontrarResultado(currentPlan, '60', currentSearchValue);
  
  if (!resultado60) {
    alert('⚠️ No se encontró un resultado para 60 meses con el pago/monto actual. Primero realiza una búsqueda.');
    return;
  }
  
  // Tomar el monto del plazo de 60 meses
  const monto = resultado60.monto;
  
  // Colocar en el campo correspondiente
  document.getElementById('cncaMontoSolicitado').value = '$' + monto.toFixed(2);
  
  // Recalcular automáticamente
  calcularCNCA();
}

// Actualizar CNCA cuando cambien los campos
document.addEventListener('DOMContentLoaded', function() {
  // Event listeners para actualización automática
  ['cncaCapacidad', 'cncaDescuento', 'cncaPagoAnticipado'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', calcularCNCA);
      el.addEventListener('change', calcularCNCA);
    }
  });
});
